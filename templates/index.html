<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Java Compiler Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #080C14; }
    .font-mono { font-family: 'Fira Code', monospace; }
  </style>
</head>
<body class="text-slate-200 antialiased min-h-screen">
  <div id="root">Loading Studio...</div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [code, setCode] = useState(`class TestApp {\n    public static void main(String[] args) {\n        int x;\n        int y;\n        int result;\n        x = 10;\n        y = 5;\n        if (x > y) {\n            result = x * 2;\n        } else {\n            result = 0;\n        }\n    }\n}`);
      const [activeTab, setActiveTab] = useState(1);
      const [tac, setTac] = useState(["Click 'Compile & Run' to execute."]);
      const [symbolTable, setSymbolTable] = useState([
        { name: "x", type: "int", scope: "main", offset: "-4($fp)" },
        { name: "y", type: "int", scope: "main", offset: "-8($fp)" },
        { name: "result", type: "int", scope: "main", offset: "-12($fp)" }
      ]);
      const [tokens, setTokens] = useState([
        { token: "class", type: "KEYWORD" },
        { token: "TestApp", type: "IDENTIFIER" }
      ]);
      const [mips, setMips] = useState(["# MIPS code will appear here."]);
      const [logs, setLogs] = useState(["[INFO] Studio initialized."]);
      const [metrics, setMetrics] = useState({ tokens: 54, variables: 3, quadruples: 10, status: "READY" });
      const [connectionStatus, setConnectionStatus] = useState("Compiler Ready");
      const [isCompiling, setIsCompiling] = useState(false);

      const lines = code.split('\n');

      const compileCode = async () => {
        setIsCompiling(true);
        try {
          const response = await fetch('/compile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
          });
          const data = await response.json();
          
          if (data.tac && Array.isArray(data.tac)) setTac(data.tac);
          if (data.symbol_table && Array.isArray(data.symbol_table) && data.symbol_table.length > 0) {
            setSymbolTable(data.symbol_table);
          }
          if (data.tokens && Array.isArray(data.tokens) && data.tokens.length > 0) {
            setTokens(data.tokens);
          }
          if (data.mips && Array.isArray(data.mips)) setMips(data.mips);
          if (data.logs && Array.isArray(data.logs)) setLogs(data.logs);
          if (data.metrics) setMetrics(data.metrics);
          
          setConnectionStatus("Compiler Ready");
        } catch (err) {
          setConnectionStatus("Connection Error");
          setLogs(prev => [`[ERROR] ${err.message}`, ...prev]);
        }
        setIsCompiling(false);
      };

      return (
        <div className="min-h-screen bg-[#080C14] text-slate-200 flex flex-col p-6">
          <header className="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <div>
              <h1 className="text-xl font-bold text-white">Mini-Java Compiler Studio</h1>
              <p className="text-xs text-slate-400">Flex + Bison Architecture • TAC Quadruples • MIPS Backend</p>
            </div>
            <button
              onClick={compileCode}
              disabled={isCompiling}
              className="bg-gradient-to-r from-pink-500 to-purple-600 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-lg cursor-pointer hover:opacity-90 disabled:opacity-50 transition-all"
            >
              {isCompiling ? 'Compiling...' : '⚡ Compile & Run'}
            </button>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
            {/* Editor Panel */}
            <div className="lg:col-span-5 bg-[#0D1322] border border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-xl">
              <div className="bg-[#131B2E] px-4 py-2.5 text-xs font-mono text-slate-400 border-b border-slate-800 flex justify-between items-center">
                <span>☕ test.java (Custom Editable)</span>
                <span className="text-slate-500">Lines: {lines.length}</span>
              </div>
              <div className="flex-1 flex font-mono text-sm bg-[#0B0F19] min-h-[420px]">
                <div className="w-12 py-4 bg-[#080C14] text-slate-600 text-right pr-3 select-none border-r border-slate-800">
                  {lines.map((_, i) => <div key={i}>{i + 1}</div>)}
                </div>
                <textarea
                  value={code}
                  onChange={(e) => setCode(e.target.value)}
                  className="flex-1 bg-transparent p-4 text-slate-200 focus:outline-none resize-none font-mono text-sm leading-relaxed"
                  spellCheck="false"
                />
              </div>
            </div>

            {/* Output Panel with 5 Tabs */}
            <div className="lg:col-span-7 bg-[#0D1322] border border-slate-800 rounded-2xl p-6 flex flex-col shadow-xl font-mono text-sm">
              {/* Tab Header Navigation */}
              <div className="flex space-x-2 border-b border-slate-800 pb-3 mb-4 text-xs overflow-x-auto">
                <button 
                  onClick={() => setActiveTab(1)} 
                  className={`px-3 py-1.5 rounded-lg font-medium cursor-pointer transition-all ${activeTab === 1 ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                  1. TAC Quadruples
                </button>
                <button 
                  onClick={() => setActiveTab(2)} 
                  className={`px-3 py-1.5 rounded-lg font-medium cursor-pointer transition-all ${activeTab === 2 ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                  2. Symbol Table
                </button>
                <button 
                  onClick={() => setActiveTab(3)} 
                  className={`px-3 py-1.5 rounded-lg font-medium cursor-pointer transition-all ${activeTab === 3 ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                  3. Tokens
                </button>
                <button 
                  onClick={() => setActiveTab(4)} 
                  className={`px-3 py-1.5 rounded-lg font-medium cursor-pointer transition-all ${activeTab === 4 ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                  4. MIPS Backend
                </button>
                <button 
                  onClick={() => setActiveTab(5)} 
                  className={`px-3 py-1.5 rounded-lg font-medium cursor-pointer transition-all ${activeTab === 5 ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                  5. Console Log
                </button>
              </div>

              {/* Tab Contents */}
              <div className="flex-1 overflow-y-auto max-h-[350px] pr-2">
                {activeTab === 1 && (
                  <div className="space-y-1.5 text-slate-300">
                    <div className="text-xs text-slate-500 mb-2">Intermediate Three-Address Code Output</div>
                    {tac.map((line, idx) => (
                      <div key={idx} className={line.endsWith(':') ? 'text-amber-400 font-bold mt-2' : line.includes('=') ? 'text-cyan-300' : ''}>
                        {line}
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 2 && (
                  <div>
                    <div className="text-xs text-slate-500 mb-2">Active Scope Symbol Table</div>
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400">
                          <th className="pb-2">Variable</th>
                          <th className="pb-2">Type</th>
                          <th className="pb-2">Scope</th>
                          <th className="pb-2">Offset</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/50">
                        {Array.isArray(symbolTable) && symbolTable.map((sym, idx) => (
                          <tr key={idx} className="hover:bg-slate-800/30">
                            <td className="py-2 text-pink-400 font-semibold">{sym.name}</td>
                            <td className="py-2 text-cyan-300">{sym.type}</td>
                            <td className="py-2 text-slate-300">{sym.scope}</td>
                            <td className="py-2 text-slate-500">{sym.offset}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {activeTab === 3 && (
                  <div>
                    <div className="text-xs text-slate-500 mb-2">Lexical Token Stream (Flex Output)</div>
                    <div className="grid grid-cols-2 gap-2">
                      {tokens.map((tok, idx) => (
                        <div key={idx} className="bg-[#080C14] px-3 py-1.5 rounded-lg border border-slate-800 flex justify-between text-xs">
                          <span className="text-pink-400">{tok.token}</span>
                          <span className="text-slate-500 uppercase text-[10px] bg-slate-900 px-1.5 py-0.5 rounded">{tok.type}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 4 && (
                  <div className="space-y-1 text-slate-300">
                    <div className="text-xs text-slate-500 mb-2">Generated MIPS Assembly Code</div>
                    {mips.map((line, idx) => (
                      <div key={idx} className={line.endsWith(':') ? 'text-amber-400 font-bold mt-2' : line.startsWith('    #') ? 'text-slate-500 italic' : 'text-emerald-300'}>
                        {line}
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 5 && (
                  <div className="space-y-2 text-xs">
                    <div className="text-xs text-slate-500 mb-2">Compilation Execution Logs</div>
                    {logs.map((log, idx) => (
                      <div key={idx} className={log.includes('SUCCESS') ? 'text-emerald-400 font-semibold' : log.includes('ERROR') ? 'text-rose-400 font-semibold' : 'text-slate-300'}>
                        {log}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Metrics Footer */}
              <div className="grid grid-cols-3 gap-4 mt-6 pt-4 border-t border-slate-800">
                <div className="bg-[#080C14] p-3 rounded-xl border border-slate-800/60">
                  <div className="text-[10px] uppercase text-slate-500 font-sans font-semibold">Total Tokens</div>
                  <div className="text-lg font-bold text-pink-400 mt-1">{metrics.tokens}</div>
                </div>
                <div className="bg-[#080C14] p-3 rounded-xl border border-slate-800/60">
                  <div className="text-[10px] uppercase text-slate-500 font-sans font-semibold">Variables</div>
                  <div className="text-lg font-bold text-indigo-400 mt-1">{metrics.variables}</div>
                </div>
                <div className="bg-[#080C14] p-3 rounded-xl border border-slate-800/60">
                  <div className="text-[10px] uppercase text-slate-500 font-sans font-semibold">TAC Quadruples</div>
                  <div className="text-lg font-bold text-purple-400 mt-1">{metrics.quadruples}</div>
                </div>
              </div>
            </div>
          </div>

          <footer className="mt-6 pt-4 border-t border-slate-800/60 flex justify-between items-center text-xs text-slate-400">
            <div className="flex items-center space-x-2">
              <span className={`w-2.5 h-2.5 rounded-full ${connectionStatus === 'Compiler Ready' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
              <span>{connectionStatus}</span>
            </div>
            <div>Build Status: <span className={metrics.status === 'SUCCESS' ? 'text-emerald-400 font-bold' : 'text-amber-400 font-bold'}>{metrics.status}</span></div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
